"use strict";

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let qHigh = true;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = qHigh ? Math.max(1, 3840 / Math.max(W, H)) : Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * DPR;
  cv.height = H * DPR;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener('resize', resize);
resize();

const keys = {};
const keyMap = {
  ArrowUp: 'up', w: 'up', W: 'up',
  ArrowDown: 'down', s: 'down', S: 'down',
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  ' ': 'space', n: 'nitro', N: 'nitro', ShiftLeft: 'nitro', ShiftRight: 'nitro'
};

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if ('cCvV'.includes(e.key) && e.key.length === 1 && !e.repeat) toggleCam();
  if (e.key === 'Escape') showMenu();
  const mapped = keyMap[e.code] || keyMap[e.key];
  if (mapped) {
    keys[mapped] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  }
});

window.addEventListener('keyup', (e) => {
  const mapped = keyMap[e.code] || keyMap[e.key];
  if (mapped) keys[mapped] = false;
});

function bindTouchBtn(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;

  const on = (e) => {
    e.preventDefault();
    el.classList.add('on');
    keys[keyName] = true;
  };

  const off = (e) => {
    e.preventDefault();
    el.classList.remove('on');
    keys[keyName] = false;
  };

  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

bindTouchBtn('bL', 'left');
bindTouchBtn('bR', 'right');
bindTouchBtn('bGas', 'up');
bindTouchBtn('bBrake', 'down');
bindTouchBtn('bDrift', 'space');
bindTouchBtn('bNit', 'nitro');

const CARS = [
  { id: 'sport', name: 'Esportivo RS', col: '#ff5a3c', engine: 450, top: 390, grip: 8.5, gripDrift: 2.2, turn: 2.5, L: 44, W: 22 },
  { id: 'drift', name: 'Drift Spec', col: '#3cd6ff', engine: 400, top: 350, grip: 6.8, gripDrift: 1.5, turn: 3.0, L: 44, W: 22 },
  { id: 'muscle', name: 'V8 Muscle', col: '#ffd23c', engine: 540, top: 440, grip: 6.0, gripDrift: 2.6, turn: 2.1, L: 46, W: 23 },
  { id: 'compact', name: 'Urban Uno', col: '#eef2f8', engine: 380, top: 320, grip: 8.2, gripDrift: 2.0, turn: 2.8, L: 38, W: 20 }
];

const TRACKS = [
  { id: 'c1', name: 'Circuito Noite', w: 150, c: [[-900,-620],[-200,-780],[520,-700],[950,-380],[1050,120],[700,420],[900,760],[300,900],[-350,760],[-620,420],[-1000,300],[-1100,-150]] },
  { id: 'c2', name: 'Oval Veloz', w: 170, c: [[-900,-400],[0,-520],[900,-400],[1150,0],[900,400],[0,520],[-900,400],[-1150,0]] },
  { id: 'c3', name: 'Serpente', w: 120, c: [[-1000,-300],[-650,-650],[-250,-300],[150,-650],[550,-300],[1000,-600],[1150,-50],[800,350],[400,50],[0,450],[-400,50],[-800,450],[-1200,100]] }
];

const GRID_C = 440;
const ROAD_R = 140;
const INS = 14;
const hash = (i, j) => (((i * 73856093) ^ (j * 19349663)) >>> 0);
const isPark = (i, j) => hash(i, j) % 5 === 0;

function isCityBlocked(x, y) {
  const i = Math.floor(x / GRID_C);
  const j = Math.floor(y / GRID_C);
  const lx = x - i * GRID_C;
  const ly = y - j * GRID_C;
  if (lx < ROAD_R + INS || lx > GRID_C - INS || ly < ROAD_R + INS || ly > GRID_C - INS) return false;
  return !isPark(i, j);
}

let gameMode = 'city';
let selectedCarIdx = 0;
let selectedTrackIdx = 0;
let isPlaying = false;
let isFirstPerson = false;

const TUNE0 = { acc: 1, vmax: 1, grip: 1, steer: 1, bld: 1, hue: 0, fov: 1, fog: 1, npc: 1 };
let TUNE = Object.assign({}, TUNE0);
const ENV = { tempo: 'entardecer', rain: 0, traffic: 0.5, carHue: 10, lum: 1, sun: 1 };

const car = { x: 0, y: 0, a: 0, vx: 0, vy: 0, steer: 0, L: 44, W: 22, drifting: false, onRoad: true };
const cam = { x: 0, y: 0, zoom: 1.0, targetZoom: 1.0 };
let nitro = 1.0;

let trackPts = [], trackN = 0, trackRoadW = 150, trackScenery = [], trackMM = { cx: 0, cy: 0, s: 0.04 };
const skids = [], particles = [], npcs = [];
const telemetry = { crash: 0, vsum: 0, n: 0 };

let combo = 0, totalScore = 0, comboMult = 1, comboTimer = 0;

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t;
  const t3 = t2 * t;
  return {
    x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
    y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
  };
}

function buildTrack(idx) {
  const T = TRACKS[idx];
  const c = T.c.map((a) => ({ x: a[0], y: a[1] }));
  trackRoadW = T.w;
  trackPts = [];

  for (let i = 0; i < c.length; i++) {
    const p0 = c[(i - 1 + c.length) % c.length];
    const p1 = c[i];
    const p2 = c[(i + 1) % c.length];
    const p3 = c[(i + 2) % c.length];
    for (let s = 0; s < 40; s++) trackPts.push(catmull(p0, p1, p2, p3, s / 40));
  }

  trackN = trackPts.length;
  trackScenery = [];
  for (let i = 0; i < trackN; i += 4) {
    const t = getTrackTangent(i);
    const nx = -t.y;
    const ny = t.x;
    for (const sd of [-1, 1]) {
      if (Math.random() < 0.65) {
        const d = sd * (trackRoadW + 70 + Math.random() * 280);
        trackScenery.push({ x: trackPts[i].x + nx * d, y: trackPts[i].y + ny * d, k: Math.random() < 0.3 ? 1 : 0 });
      }
    }
  }

  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const p of trackPts) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  trackMM = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, s: Math.min(96 / (maxX - minX), 82 / (maxY - minY)) * 0.92 };
}

function getTrackTangent(i) {
  const a = trackPts[(i - 1 + trackN) % trackN];
  const b = trackPts[(i + 1) % trackN];
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const L = Math.hypot(dx, dy) || 1;
  return { x: dx / L, y: dy / L };
}

function getNearestTrackPt(px, py) {
  let best = 1e18;
  let bi = 0;
  for (let i = 0; i < trackN; i += 2) {
    const d = (trackPts[i].x - px) ** 2 + (trackPts[i].y - py) ** 2;
    if (d < best) {
      best = d;
      bi = i;
    }
  }
  return { x: trackPts[bi].x, y: trackPts[bi].y, idx: bi, dist: Math.sqrt(best) };
}

function resetCarPosition() {
  if (gameMode === 'drift') {
    buildTrack(selectedTrackIdx);
    const p = trackPts[0];
    const t = getTrackTangent(0);
    car.x = p.x;
    car.y = p.y;
    car.a = Math.atan2(t.y, t.x);
  } else {
    car.x = ROAD_R / 2;
    car.y = 0;
    car.a = -Math.PI / 2;
  }

  car.vx = 0;
  car.vy = 0;
  car.steer = 0;
  const spec = CARS[selectedCarIdx];
  car.L = spec.L;
  car.W = spec.W;
  cam.x = car.x;
  cam.y = car.y;
}

function checkCityHits(x, y, a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  for (const [px, py] of [[22,10],[22,-10],[-22,10],[-22,-10],[0,0]]) {
    if (isCityBlocked(x + px * c - py * s, y + px * s + py * c)) return true;
  }
  return false;
}

const DA = [0, Math.PI / 2, Math.PI, -Math.PI / 2];

function spawnNPC(n) {
  let attempts = 0;
  do {
    const hz = Math.random() < 0.5;
    const dir = hz ? (Math.random() < 0.5 ? 0 : 2) : (Math.random() < 0.5 ? 1 : 3);
    const ri = (hz ? Math.floor(car.y / GRID_C) : Math.floor(car.x / GRID_C)) + Math.floor(Math.random() * 7) - 3;
    const along = (hz ? car.x : car.y) + (Math.random() * 2 - 1) * 1100;
    const lane = ri * GRID_C + ROAD_R / 2 + ((dir === 0 || dir === 3) ? 35 : -35);
    n.dir = dir;
    n.a = DA[dir];
    n.x = hz ? along : lane;
    n.y = hz ? lane : along;
    n.lane = lane;
  } while (Math.hypot(n.x - car.x, n.y - car.y) < 300 && ++attempts < 8);

  n.v = 0;
  n.max = 170 + Math.random() * 90;
  n.hue = Math.random() * 360;
}

function updateNPCs(dt) {
  if (gameMode !== 'city') {
    npcs.length = 0;
    return;
  }

  const want = Math.round(ENV.traffic * 20);
  while (npcs.length < want) {
    const n = {};
    spawnNPC(n);
    npcs.push(n);
  }

  while (npcs.length > want) npcs.pop();

  for (const n of npcs) {
    if (Math.hypot(n.x - car.x, n.y - car.y) > 1500) {
      spawnNPC(n);
      continue;
    }

    const c = Math.cos(n.a), s = Math.sin(n.a);
    let tv = n.max * TUNE.npc;

    for (const o of [car, ...npcs]) {
      if (o === n) continue;
      const dx = o.x - n.x;
      const dy = o.y - n.y;
      const f = dx * c + dy * s;
      const l = -dx * s + dy * c;
      if (f > 0 && f < 110 && Math.abs(l) < 24) tv = Math.min(tv, Math.max(0, (f - 48) * 3));
    }

    n.v += (tv - n.v) * Math.min(1, dt * 2.5);
    n.x += Math.cos(n.a) * n.v * dt;
    n.y += Math.sin(n.a) * n.v * dt;

    const dx = car.x - n.x;
    const dy = car.y - n.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 34) {
      car.x += dx / d * (34 - d);
      car.y += dy / d * (34 - d);
      car.vx *= 0.75;
      car.vy *= 0.75;
      n.v *= 0.3;
      telemetry.crash += dt * 4;
    }
  }
}

function update(dt) {
  const curCar = CARS[selectedCarIdx];
  const up = keys.up;
  const down = keys.down;
  const hb = keys.space;
  const boost = keys.nitro && nitro > 0;

  if (boost) nitro = Math.max(0, nitro - dt * 0.25);
  else nitro = Math.min(1.0, nitro + dt * 0.1);

  const tgtSteer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  car.steer += (tgtSteer - car.steer) * Math.min(1, dt * 8);

  const cosA = Math.cos(car.a), sinA = Math.sin(car.a);
  let vf = car.vx * cosA + car.vy * sinA;
  let vl = -car.vx * sinA + car.vy * cosA;

  const turnPower = curCar.turn * TUNE.steer * (hb ? 1.35 : 1.0);
  const turn = car.steer * Math.min(1, Math.abs(vf) / 120) * Math.sign(vf || 1) * 2.7 * turnPower;
  car.a += turn * dt;

  const fCos = Math.cos(car.a), fSin = Math.sin(car.a);
  vf = car.vx * fCos + car.vy * fSin;
  vl = -car.vx * fSin + car.vy * fCos;

  const enginePower = curCar.engine * TUNE.acc * (boost ? 1.8 : 1.0);
  if (up) vf += enginePower * Math.max(0, 1 - vf / (curCar.top * TUNE.vmax)) * dt;
  if (down) {
    if (vf > 25) vf -= 900 * dt;
    else vf -= 280 * dt;
  }
  if (!up && !down) vf -= Math.sign(vf) * Math.min(Math.abs(vf), 90 * dt);

  car.drifting = hb && Math.abs(vf) > 50;
  const gripFactor = car.drifting ? curCar.gripDrift : curCar.grip * TUNE.grip;
  vl *= Math.exp(-gripFactor * dt);

  car.vx = fCos * vf - fSin * vl;
  car.vy = fSin * vf + fCos * vl;

  if (gameMode === 'city') {
    const nx = car.x + car.vx * dt;
    const ny = car.y + car.vy * dt;
    if (!checkCityHits(nx, ny, car.a)) {
      car.x = nx;
      car.y = ny;
    } else {
      telemetry.crash += dt;
      if (!checkCityHits(nx, car.y, car.a)) {
        car.x = nx;
        car.vy *= -0.3;
        car.vx *= 0.8;
      } else if (!checkCityHits(car.x, ny, car.a)) {
        car.y = ny;
        car.vx *= -0.3;
        car.vy *= 0.8;
      } else {
        car.vx *= -0.25;
        car.vy *= -0.25;
      }
    }
  } else {
    car.x += car.vx * dt;
    car.y += car.vy * dt;
    const n = getNearestTrackPt(car.x, car.y);
    car.onRoad = n.dist < trackRoadW;
    if (!car.onRoad) {
      const dx = car.x - n.x;
      const dy = car.y - n.y;
      const L = Math.hypot(dx, dy) || 1;
      const over = n.dist - trackRoadW;
      car.x -= dx / L * Math.min(over, 60) * dt * 3;
      car.y -= dy / L * Math.min(over, 60) * dt * 3;
      car.vx *= Math.max(0, 1 - 1.8 * dt);
      car.vy *= Math.max(0, 1 - 1.8 * dt);
    }
  }

  const slip = Math.abs(Math.atan2(vl, vf));
  if (car.drifting && slip > 0.18) {
    combo += (Math.abs(vf) * slip * 0.14) * dt;
    comboMult = 1 + Math.min(4, combo / 600);
    comboTimer = 0;
  } else {
    comboTimer += dt;
    if (comboTimer > 0.9 && combo > 0) {
      totalScore += Math.round(combo * comboMult);
      flashMessage('+' + Math.round(combo * comboMult) + ' PTS');
      combo = 0;
      comboMult = 1;
    }
  }

  const k = Math.min(1, dt * 5);
  cam.x += (car.x + car.vx * 0.28 - cam.x) * k;
  cam.y += (car.y + car.vy * 0.28 - cam.y) * k;

  document.getElementById('spd').textContent = Math.round(Math.hypot(car.vx, car.vy) * 0.25);
  document.getElementById('nitf').style.width = Math.round(nitro * 100) + '%';
  document.getElementById('combo').textContent = Math.round(combo);
  document.getElementById('total').textContent = Math.round(totalScore + combo * comboMult);
  document.getElementById('driftbox').style.display = gameMode === 'drift' ? 'block' : 'none';
}

function toScreen(x, y) {
  return { x: (x - cam.x) * cam.zoom + W / 2, y: (y - cam.y) * cam.zoom + H / 2 };
}

function drawTopDown() {
  ctx.setTransform(DPR * cam.zoom, 0, 0, DPR * cam.zoom, DPR * (W / 2 - cam.x * cam.zoom), DPR * (H / 2 - cam.y * cam.zoom));
  const hw = W / 2 / cam.zoom + 40;
  const hh = H / 2 / cam.zoom + 40;
  const x0 = cam.x - hw;
  const x1 = cam.x + hw;
  const y0 = cam.y - hh;
  const y1 = cam.y + hh;

  ctx.fillStyle = '#10141d';
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);

  if (gameMode === 'city') {
    const bs = GRID_C - ROAD_R;
    for (let i = Math.floor((x0 - ROAD_R) / GRID_C); i <= Math.floor(x1 / GRID_C); i++) {
      for (let j = Math.floor((y0 - ROAD_R) / GRID_C); j <= Math.floor(y1 / GRID_C); j++) {
        const bx = i * GRID_C + ROAD_R;
        const by = j * GRID_C + ROAD_R;
        const h = hash(i, j);
        if (isPark(i, j)) {
          ctx.fillStyle = '#1e382b';
          ctx.fillRect(bx, by, bs, bs);
        } else {
          ctx.fillStyle = '#212836';
          ctx.fillRect(bx, by, bs, bs);
          const bw = bs - INS * 2;
          ctx.fillStyle = 'hsl(' + ((h + TUNE.hue) % 360) + ',28%,' + (28 + h % 18) + '%)';
          ctx.fillRect(bx + INS, by + INS, bw, bw);
        }
      }
    }
  } else {
    ctx.lineWidth = trackRoadW * 2;
    ctx.strokeStyle = '#232a3b';
    ctx.beginPath();
    trackPts.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.a);
  ctx.fillStyle = CARS[selectedCarIdx].col;
  ctx.fillRect(-car.L / 2, -car.W / 2, car.L, car.W);
  ctx.fillStyle = '#fff';
  ctx.fillRect(car.L / 2 - 4, -car.W / 2 + 2, 4, 4);
  ctx.fillRect(car.L / 2 - 4, car.W / 2 - 6, 4, 4);
  ctx.restore();
}

function drawFP() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hor = H * 0.46;
  const F = W * TUNE.fov * 0.8;

  const skyGrad = ctx.createLinearGradient(0, 0, 0, hor);
  skyGrad.addColorStop(0, '#0a0d18');
  skyGrad.addColorStop(1, '#1a243a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, hor);

  const groundGrad = ctx.createLinearGradient(0, hor, 0, H);
  groundGrad.addColorStop(0, '#121622');
  groundGrad.addColorStop(1, '#080a10');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, hor, W, H - hor);

  ctx.fillStyle = CARS[selectedCarIdx].col;
  ctx.beginPath();
  ctx.moveTo(W * 0.15, H);
  ctx.lineTo(W * 0.35, H * 0.8);
  ctx.lineTo(W * 0.65, H * 0.8);
  ctx.lineTo(W * 0.85, H);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (isFirstPerson) drawFP();
  else drawTopDown();
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;

  if (isPlaying) {
    update(dt);
    updateNPCs(dt);
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const menuModal = document.getElementById('menu-modal');
const centerMsg = document.getElementById('center-msg');
let msgTimer = 0;

function flashMessage(txt) {
  centerMsg.textContent = txt;
  centerMsg.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => {
    centerMsg.style.opacity = '0';
  }, 2000);
}

function toggleCam() {
  isFirstPerson = !isFirstPerson;
  document.getElementById('bCam').textContent = isFirstPerson ? '👁 VISÃO: 1ª P' : '👁 VISÃO: TOP';
}

function showMenu() {
  isPlaying = false;
  menuModal.hidden = false;
}

function renderMenuOptions() {
  const carRow = document.getElementById('car-row');
  const trackRow = document.getElementById('track-row');
  const trackLbl = document.getElementById('track-lbl');

  carRow.innerHTML = '';
  CARS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (selectedCarIdx === i ? ' sel' : '');
    btn.textContent = c.name;
    btn.onclick = () => {
      selectedCarIdx = i;
      renderMenuOptions();
    };
    carRow.appendChild(btn);
  });

  trackRow.innerHTML = '';
  if (gameMode === 'drift') {
    trackRow.style.display = 'flex';
    trackLbl.style.display = 'block';
    TRACKS.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn' + (selectedTrackIdx === i ? ' sel' : '');
      btn.textContent = t.name;
      btn.onclick = () => {
        selectedTrackIdx = i;
        renderMenuOptions();
      };
      trackRow.appendChild(btn);
    });
  } else {
    trackRow.style.display = 'none';
    trackLbl.style.display = 'none';
  }
}

document.querySelectorAll('#mode-row .opt-btn').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('#mode-row .opt-btn').forEach((b) => b.classList.remove('sel'));
    btn.classList.add('sel');
    gameMode = btn.dataset.mode;
    renderMenuOptions();
  };
});

document.querySelectorAll('#gfx-row .opt-btn').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('#gfx-row .opt-btn').forEach((b) => b.classList.remove('sel'));
    btn.classList.add('sel');
    qHigh = btn.dataset.gfx === 'high';
    resize();
  };
});

document.getElementById('btn-start').onclick = () => {
  menuModal.hidden = true;
  resetCarPosition();
  isPlaying = true;
  flashMessage('ACELERE!');
};

document.getElementById('bMenu').onclick = showMenu;
document.getElementById('bCam').onclick = toggleCam;

const aiDrawer = document.getElementById('ai-drawer');
document.getElementById('bAI').onclick = () => {
  aiDrawer.hidden = !aiDrawer.hidden;
};

document.getElementById('ai-send').onclick = () => {
  const input = document.getElementById('ai-input');
  const txt = input.value.trim().toLowerCase();
  if (!txt) return;

  if (txt.includes('noite')) ENV.tempo = 'noite';
  if (txt.includes('dia')) ENV.tempo = 'dia';
  if (txt.includes('chuva')) ENV.rain = 0.8;
  if (txt.includes('rapido') || txt.includes('física')) TUNE.acc = 2.0;
  if (txt.includes('drift')) TUNE.grip = 0.3;

  document.getElementById('ai-msgs').textContent = 'Diretor IA: Aplicando "' + txt + '"...';
  input.value = '';
};

renderMenuOptions();
